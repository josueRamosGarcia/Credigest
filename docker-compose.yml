services:
  db:
    image: postgres:16-alpine
    container_name: credigest-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-credigest}
    ports:
      - "5433:5432"
    volumes:
      - credigest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-credigest}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  credigest_pgdata:
