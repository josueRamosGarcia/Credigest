name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credigest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d credigest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/credigest_test

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Tipos
        run: uv run mypy app

      - name: Migraciones
        run: uv run alembic upgrade head

      - name: Pruebas
        run: uv run pytest --cov=app --cov-report=term-missing
